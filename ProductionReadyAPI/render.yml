services:
  - type: web
    name: secure-ai-gateway
    env: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
    plan: free # Can be updated to 'starter' or higher for production use
    region: oregon # Choose closest region to your users
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PRIMARY_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
